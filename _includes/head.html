{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Website favicon -->
<link rel="icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico">

<!-- Apple/iPhone home screen icon -->
<link rel="apple-touch-icon" href="{{ base_path }}/images/loo.png">
<link rel="manifest" href="{{ base_path }}/_data/manifest.json">
<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
